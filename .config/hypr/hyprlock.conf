# CODE7X HYPRLOCK CONFIG - V2.0
# "THE ARCHITECT'S VISION" - AI OS / CYBERPUNK / KAWAII-TECH

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /home/ishanmanisingh/.cache/current_wallpaper.png
    color = rgba(10, 10, 20, 1.0)
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- TOP LEFT: BRANDING & SYSTEM HUD ---

# CODE7X ASCII LOGO (CYAN GLOW)
label {
    monitor =
    text = cmd[update:3600000] cat /home/ishanmanisingh/.config/hypr/assets/code7x.txt
    color = rgba(0, 255, 255, 0.9)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 40, -40
    halign = left
    valign = top
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 255, 255, 0.6)
}

# ANIMATED DECORATIVE LINE
label {
    monitor =
    text = cmd[update:100] /home/ishanmanisingh/.config/hypr/scripts/code7x_anim.sh
    color = rgba(0, 255, 255, 0.3)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 40, -170
    halign = left
    valign = top
}

# MAIN SYSTEM STATS HUD
label {
    monitor =
    text = cmd[update:1000] /home/ishanmanisingh/.config/hypr/scripts/code7x_hud.sh
    color = rgba(0, 255, 255, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 40, -200
    halign = left
    valign = top
}

# LIVE SCANNER (JARVIS STYLE)
label {
    monitor =
    text = cmd[update:500] echo "SYSTEM_SCAN: $[RANDOM % 10 + 90].$[RANDOM % 9]% COMPLETE... NO_THREATS_FOUND"
    color = rgba(0, 255, 255, 0.5)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 40, -480
    halign = left
    valign = top
}

# --- CENTER: TEMPORAL DATA ---

# GIANT FUTURISTIC CLOCK
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 255, 255, 0.4)
}

# DATE UNDER CLOCK
label {
    monitor =
    text = cmd[update:1000] date +"%A | %d %B %Y | PROTOCOL_STAMP"
    color = rgba(0, 255, 255, 0.7)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# --- RIGHT: ACCESS CONTROL ---

# GLASSMORPHISM PASSWORD BOX
input-field {
    monitor =
    size = 450, 70
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 255, 255, 0.6)
    inner_color = rgba(10, 10, 20, 0.7)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    rounding = 20
    check_color = rgba(0, 255, 255, 1.0)
    fail_color = rgba(255, 50, 100, 1.0)
    placeholder_text = <span foreground="##00ffffaa" font_family="JetBrainsMono Nerd Font"><b>ENTER_ACCESS_KEY_TO_INITIALIZE...</b></span>
    hide_input = false
    position = 500, -120
    halign = center
    valign = center
}

# BOTTOM LEFT: NEURAL UPLINK LOG
label {
    monitor =
    text = cmd[update:2000] /home/ishanmanisingh/.config/hypr/scripts/code7x_logs.sh
    color = rgba(0, 255, 255, 0.4)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 40, 100
    halign = left
    valign = bottom
}

# BOTTOM LEFT: DECORATIVE HEADER
label {
    monitor =
    text = ⚡ NEURAL_UPLINK_STATUS
    color = rgba(0, 255, 255, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 40, 240
    halign = left
    valign = bottom
}

# LOGIN STATUS INDICATOR
label {
    monitor =
    text = 🗝️ BIOMETRIC_RECOGNITION_ACTIVE_[◣_◢]
    color = rgba(0, 255, 255, 0.5)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 500, -200
    halign = center
    valign = center
}

# --- DECORATIVE UI ELEMENTS ---

# VERTICAL SIDE BAR
shape {
    monitor =
    size = 4, 1000
    color = rgba(0, 255, 255, 0.15)
    position = 20, 0
    halign = left
    valign = center
}

# HUD SEPARATOR
shape {
    monitor =
    size = 420, 2
    color = rgba(0, 255, 255, 0.4)
    position = 40, -190
    halign = left
    valign = top
}

# BOTTOM GLITCH LINE
label {
    monitor =
    text = ▓▒░ CODE7X_OS_V2.0_INITIALIZED ░▒▓
    color = rgba(0, 255, 255, 0.2)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
